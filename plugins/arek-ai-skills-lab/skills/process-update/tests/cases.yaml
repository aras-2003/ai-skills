cases:
  - id: process-update-001
    case: positive
    input: |
      Recruiter called: SHL test next, then final stage. Update the process status and next action.
    expected:
      should_trigger: true
      must:
        - follow the skill boundary and output contract
  - id: process-update-002
    case: negative
    input: |
      Is this role worth pursuing?
    expected:
      should_trigger: false
      must_not:
        - perform this skill's core task
  - id: process-update-003
    case: reeval
    input: |
      The recruiter says the role actually has no team and reports two levels lower than expected. Update status and flag whether re-evaluation is needed.
    expected:
      should_trigger: true
      must:
        - follow the skill boundary and output contract
