cases:
  - id: strategy-to-execution-diagnostic-001
    case: positive
    input: |
      Apply strategy-to-execution-diagnostic to a realistic organisational architecture problem with incomplete but usable evidence.
    expected:
      should_trigger: true
      must:
        - follow the skill boundary and output contract
        - preserve uncertainty
  - id: strategy-to-execution-diagnostic-002
    case: near-miss
    input: |
      Give me a generic explanation unrelated to this skill.
    expected:
      should_trigger: false
      must_not:
        - perform the full strategy-to-execution-diagnostic workflow
  - id: strategy-to-execution-diagnostic-003
    case: evidence-boundary
    input: |
      The organisation has conflicting stakeholder accounts and missing ownership data. Use strategy-to-execution-diagnostic without inventing facts.
    expected:
      should_trigger: true
      must:
        - distinguish evidence from inference
        - surface material unknowns
