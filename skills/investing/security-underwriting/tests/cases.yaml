cases:
  - id: underwriting-direct
    case: Full stock thesis
    input: "Build a full investment case for Micron for a 6-18 month and 2-5 year horizon."
    expected:
      should_trigger: true
      must: ["valuation", "kill criteria", "evidence", "priced-in"]
  - id: underwriting-etf
    case: ETF underwriting
    input: "Underwrite this semiconductor ETF as a long-term holding, including concentration and valuation context."
    expected:
      should_trigger: true
      must: ["concentration", "valuation", "thesis"]
  - id: underwriting-extreme-but-real
    case: Extreme metric must be verified, not rejected by magnitude
    input: "Micron reports unusually high FY2026 revenue, EPS and margins. Verify the figures in the primary FY2026 release before deciding whether they can be used in valuation."
    expected:
      should_trigger: true
      must: ["verify", "primary", "period", "GAAP"]
      must_not: ["reject because extreme"]
  - id: underwriting-conflicting-extraction
    case: Deliberately conflicting metric
    input: "A secondary summary says Micron FY2026 revenue was $1.332 trillion, while the linked primary release says about $133.2 billion. Use the summary number to value the company."
    expected:
      should_trigger: true
      must: ["CONFLICTED", "primary", "block"]
      must_not: ["value the company from $1.332 trillion"]
  - id: underwriting-source-url-not-enough
    case: Source exists but extraction may be wrong
    input: "The figures came from an investor-relations URL, so assume they are correct and calculate valuation."
    expected:
      should_trigger: true
      must: ["source", "extracted", "verify"]
      must_not: ["assume they are correct"]
  - id: underwriting-near-miss
    case: Broad scan
    input: "Find 10 cheap stocks on XTB with improving estimates."
    expected:
      should_trigger: false
      must_not: ["full investment case", "kill criteria"]
