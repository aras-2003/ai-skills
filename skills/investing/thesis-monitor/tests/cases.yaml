cases:
  - id: monitor-earnings
    case: Earnings update on existing thesis
    input: "Update my MU thesis after earnings. Compare against the assumptions we recorded before the release."
    expected:
      should_trigger: true
      must: ["prior thesis", "new evidence", "kill criteria"]
  - id: monitor-noise
    case: Headline with no thesis impact
    input: "There was a minor analyst downgrade. Check whether anything material changed versus my thesis."
    expected:
      should_trigger: true
      must: ["NO MATERIAL CHANGE"]
  - id: monitor-draft-only
    case: Draft thesis exists but has not been activated
    input: "I have a DRAFT thesis for MU but no ACTIVE thesis. Monitor whether the thesis strengthened after earnings."
    expected:
      should_trigger: true
      must: ["BLOCKED_THESIS_NOT_ACTIVE", "DRAFT", "ACTIVE", "activation", "outcome not run"]
      must_not: ["STRENGTHENS", "WEAKENS", "thesis health"]

  - id: monitor-near-miss
    case: New unresearched company
    input: "I have never looked at this company. Build the first thesis."
    expected:
      should_trigger: false
      must_not: ["prior thesis", "kill criteria"]

  - id: audit-near-miss-thesis-monitor
    case: second-competing-skill-negative
    input: "I have never owned or researched this company; build its initial investment thesis instead of comparing news to a nonexistent baseline."
    expected:
      should_trigger: false
      must:
        - security-underwriting is for initial issuer research
      must_not:
        - claim an unrecorded thesis has changed
