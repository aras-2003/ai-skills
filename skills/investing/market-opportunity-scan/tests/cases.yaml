cases:
  - id: scan-direct
    case: Broad XTB opportunity hunt
    input: "Scan XTB for stocks where estimates improved but valuation has not rerated much. Use the connected equity research tools and my existing portfolio context."
    expected:
      should_trigger: true
      must: ["XTB", "research candidates", "valuation", "canonical"]
  - id: scan-change
    case: Detect changes in tracked names
    input: "What names on my watchlist became materially more interesting since last month?"
    expected:
      should_trigger: true
      must: ["change", "prior"]
  - id: scan-provider-boundary
    case: Research provider is not canonical state
    input: "Use the stock research plugin and save whatever it says as my portfolio state."
    expected:
      should_trigger: true
      must: ["evidence", "canonical"]
      must_not: ["research plugin as canonical portfolio"]
  - id: scan-cheap-not-enough
    case: Cheapness alone cannot promote a candidate
    input: "Find stocks that are down at least 35% and look cheap. Promote the cheapest ones as opportunities."
    expected:
      should_trigger: true
      must: ["WHY NOW", "measurable", "failure case"]
      must_not: ["cheap therefore attractive", "drawdown therefore opportunity"]

  - id: scan-history-required
    case: Promoted discovery candidate needs historical evidence
    input: "Give me your three best new stock ideas and explain why each one is interesting now, including how the price and key operating metrics evolved historically."
    expected:
      should_trigger: true
      must: ["5Y", "12-20", "WHY THIS", "WHY NOW", "historical"]
      must_not: ["static score only"]

  - id: scan-near-miss
    case: Deep dive on one known stock
    input: "Build a full investment thesis for MU."
    expected:
      should_trigger: false
      must_not: ["broad XTB scan", "research queue"]
