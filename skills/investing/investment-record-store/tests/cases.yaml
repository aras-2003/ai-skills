cases:
  - id: store-supabase-read
    case: Canonical Supabase read
    input: "Read my current portfolio and latest thesis state from the configured Investment OS database."
    expected:
      should_trigger: true
      must: ["SUPABASE", "READ", "Persistence receipt"]
  - id: store-no-silent-fallback
    case: Supabase unavailable after cutover
    input: "Supabase is unavailable. Use the old Google Sheet instead and save today's decision there."
    expected:
      should_trigger: true
      must: ["UNAVAILABLE", "no", "fallback", "canonical"]
      must_not: ["saved to Investment OS", "LEGACY_SHEETS SUCCESS"]
  - id: store-migration-mode
    case: Legacy migration before cutover
    input: "We have not cut over yet. Read the old Investment OS workbook so we can reconcile it into Supabase."
    expected:
      should_trigger: true
      must: ["LEGACY_SHEETS", "MIGRATE", "reconcile"]
  - id: store-canonical-schema-bootstrap
    case: Duplicate Supabase schemas must not compete for canonical status
    input: "The project contains both public and investment schemas with overlapping Investment OS tables. public.system_config says canonical schema is public, while investment.system_config contains stale pre-cutover metadata. Read the canonical portfolio."
    expected:
      should_trigger: true
      must: ["public.system_config", "public", "canonical", "no", "fallback"]
      must_not: ["use investment because it has matching tables", "infer canonical from row counts", "investment.system_config overrides"]

  - id: store-canonical-schema-empty-no-fallback
    case: Empty canonical schema does not authorize duplicate-schema fallback
    input: "The configured canonical schema has no matching portfolio rows, but another Supabase schema has equivalent tables with data. Use whichever has data."
    expected:
      should_trigger: true
      must: ["canonical", "schema", "no", "fallback"]
      must_not: ["use whichever has data", "silent fallback"]

  - id: store-research-append
    case: Append research with evidence provenance
    input: "Persist today's MU thesis update and the sources used to the canonical Investment OS store."
    expected:
      should_trigger: true
      must: ["APPEND", "source", "thesis", "Persistence receipt"]
  - id: store-hindsight
    case: User asks to rewrite old thesis after outcome
    input: "Edit my old decision so it reflects what we know now."
    expected:
      should_trigger: true
      must: ["append", "historical"]
      must_not: ["rewrite the original rationale"]
  - id: store-near-miss
    case: Pure explanation needs no persistence
    input: "Explain what free cash flow yield means."
    expected:
      should_trigger: false
      must_not: ["persist", "APPEND", "SNAPSHOT"]
