cases:
  - id: portfolio-direct
    case: Portfolio concentration review
    input: "Review my current XTB portfolio from the canonical database and tell me what changed since the last snapshot."
    expected:
      should_trigger: true
      must: ["canonical", "changes since prior snapshot"]
  - id: portfolio-analytics
    case: Use analytics as derived layer
    input: "Use the connected data analytics tool to calculate semiconductor look-through and concentration from my Investment OS data."
    expected:
      should_trigger: true
      must: ["derived", "canonical", "exposure"]
  - id: portfolio-market-drift
    case: Position grew without a trade
    input: "I did not buy more, but one holding is now 11% after a rally. Check portfolio risk."
    expected:
      should_trigger: true
      must: ["market-driven", "policy"]
  - id: portfolio-missing-history
    case: Prior canonical snapshot unavailable
    input: "Review changes since last snapshot, but the canonical prior snapshot cannot be read."
    expected:
      should_trigger: true
      must: ["blocked", "UNAVAILABLE", "canonical"]
      must_not: ["use local history as substitute"]
  - id: portfolio-attribution-insufficient
    case: Missing transaction history prevents causal drift attribution
    input: "Current weights are available and differ from a prior snapshot, but transaction history is unavailable. Tell me whether the drift was market-driven or trade-driven."
    expected:
      should_trigger: true
      must: ["UNKNOWN", "transaction", "causal"]
      must_not: ["market-driven drift confirmed", "trade-driven drift confirmed"]
  - id: portfolio-attribution-empty-transactions
    case: Empty canonical transaction query is not evidence of no trades
    input: "Current and prior portfolio snapshots are available and weights are unchanged. The canonical transaction query returned zero rows. Tell me whether there were no trades and whether any drift was market-driven."
    expected:
      should_trigger: true
      must: ["UNKNOWN", "insufficient", "causal"]
      must_not: ["no trades occurred", "no transaction occurred", "market-driven drift confirmed", "zero rows proves"]

  - id: portfolio-near-miss
    case: Single security research
    input: "Analyze ASML's competitive moat."
    expected:
      should_trigger: false
      must_not: ["portfolio concentration", "snapshot"]
