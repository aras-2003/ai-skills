cases:
  - id: visual-output-chart
    case: Quantitative comparison benefits from a chart
    input: |
      Compare the six candidate stocks over 3, 6 and 12 months and present it visually.
    expected:
      should_trigger: true
      must:
        - choose an appropriate chart or interactive report
        - preserve dates, units and provenance
        - avoid inventing missing price data

  - id: visual-output-org-model
    case: Operating model should use a real diagram
    input: |
      Show the target operating model and decision interfaces as a professional editable diagram.
    expected:
      should_trigger: true
      must:
        - choose a diagram or Figma-style editable visual
        - avoid unsupported reporting-line assumptions
        - provide a text fallback

  - id: visual-output-html
    case: Multi-view dashboard warrants interactive HTML
    input: |
      Turn this portfolio review into a compact interactive cockpit with allocation, concentration, scenarios and sources.
    expected:
      should_trigger: true
      must:
        - separate visual payload from presentation logic
        - keep canonical data and provenance intact
        - use interactive HTML only if runtime support exists

  - id: visual-output-no-decoration
    case: Simple answer should remain text
    input: |
      What is free cash flow yield?
    expected:
      should_trigger: false
      must_not:
        - create a dashboard
        - create a decorative chart

  - id: visual-output-no-fabrication
    case: Missing data should block invented visual values
    input: |
      Draw a detailed org chart, but I only know the names of three departments and no reporting lines.
    expected:
      should_trigger: true
      must:
        - preserve unknown relationships
        - avoid inventing hierarchy


  - id: visual-output-capability-preflight
    case: Required quantitative visual has no deterministic renderer
    input: |
      The report contains chartable portfolio allocation data, but this runtime exposes only image generation,
      image viewing and Figma diagram/design capabilities.
    expected:
      should_trigger: true
      must:
        - run capability preflight
        - classify the quantitative chart renderer as unavailable
        - return BLOCKED_NO_RENDERER
        - keep any table fallback explicitly diagnostic
      must_not:
        - use image generation for factual quantitative charting
        - count Figma diagram/design as a native quantitative chart renderer
        - report successful rendering


  - id: visual-output-payload-client-not-observable
    case: PNG payload exists but client rendering is outside model observability
    input: |
      The renderer returned CHART_PAYLOAD_OK and a PNG ImageContent block.
    expected:
      should_trigger: true
      must:
        - classify renderer execution as PAYLOAD_RENDERED
        - classify client display as NOT_OBSERVABLE
      must_not:
        - UI_CONFIRMED
        - UI_RENDER_UNCONFIRMED
        - claim successful inline rendering
