cases:
  - id: executive-role-001
    case: inflated-cto-title
    input: |
      Evaluate this opportunity. CTO at a 150-person company, reports to COO, no direct reports initially,
      technology delivered mostly by vendors. Candidate targets broad executive technology ownership.
    expected:
      should_trigger: true
      must:
        - detect title inflation risk
        - investigate decision authority
        - avoid treating CTO title as proof of executive scope
        - keep confidence below high while mandate is unclear
      must_not:
        - assume CIO-level authority
        - invent numeric scores

  - id: executive-role-002
    case: deputy-cio-major-enterprise
    input: |
      Evaluate a Deputy CIO role reporting directly to Group CIO. Owns technology strategy, IT performance
      and architecture in an enterprise with 3000+ IT employees, without direct infrastructure operations.
    expected:
      should_trigger: true
      must:
        - recognize bridge-to-CIO potential
        - assess scale mandate and executive exposure separately
        - avoid over-penalizing absence of full CIO scope

  - id: executive-role-003
    case: incomplete-recruiter-message
    input: |
      Recruiter says: Looking for a senior technology leader for a major international company.
      Assess whether this is worth pursuing.
    expected:
      should_trigger: true
      must:
        - keep unsupported dimensions UNKNOWN
        - use low confidence
        - identify decision-critical discovery questions
      must_not:
        - invent role scope
        - turn UNKNOWN into zero

  - id: executive-role-004
    case: company-research-only-pl
    input: |
      Sprawdź przychody, zatrudnienie, właściciela i ostatnie przejęcia Kelvion.
      Wcześniej rozmawialiśmy też o jednej z ich ról.
    expected:
      should_trigger: false
      must_not:
        - infer whether the role is attractive
        - discuss candidate fit
        - recommend recruitment actions

  - id: executive-role-005
    case: company-context-to-role-evaluation-en
    input: |
      Kelvion has separate global D&IT and Technology leadership. What does that imply for the local CTO role I am considering?
    expected:
      should_trigger: true
      must:
        - interpret company context only in relation to the role
        - make decision and confidence explicit
        - identify reporting and decision-rights unknowns

  - id: executive-role-006
    case: compact-output
    input: |
      CTO, 150-person company, reports to COO, no team initially, vendor-heavy IT. Is it worth continuing?
      Keep it compact.
    expected:
      should_trigger: true
      must:
        - make decision state explicit
        - make confidence explicit
        - identify authority and team as critical unknowns
      must_not:
        - force irrelevant long-form sections
        - invent numeric scores

  - id: executive-role-007
    case: requested-table-format
    input: |
      Compare these two executive technology roles in a compact table. Include decision, confidence, role quality,
      candidate fit, career value, risk, strongest counterargument and critical unknowns. Do not add prose before the table.
    expected:
      should_trigger: true
      must:
        - respect the requested table format
        - preserve decision and confidence
        - preserve material risks and critical unknowns
      must_not:
        - force the default header before the requested table
        - invent numeric scores

  - id: executive-role-008
    case: unsupported-score-request
    input: |
      Give this vague CTO role a score out of 100 even though reporting line, team and budget are unknown.
    expected:
      should_trigger: true
      must:
        - explain that the default model is qualitative
        - keep missing mandate evidence unknown
      must_not:
        - improvise a numeric total without a defined scoring contract

  - id: executive-role-009
    case: cv-tailoring-near-miss
    input: |
      Tailor my CV to this CTO job description and rewrite the executive summary.
    expected:
      should_trigger: false
      must_not:
        - perform a full executive role evaluation

  - id: executive-role-010
    case: transformation-without-authority
    input: |
      Technology Transformation Director responsible for modernization. Functional teams remain controlled
      by separate directors and budget is approved elsewhere.
    expected:
      should_trigger: true
      must:
        - identify accountability-authority mismatch
        - treat the mismatch as a structural risk
        - generate decision-critical questions about governance and escalation rights
