cases:
  - id: decision-rights-review-001
    case: positive
    input: |
      Apply decision-rights-review to a realistic organisational architecture problem with incomplete but usable evidence.
    expected:
      should_trigger: true
      must:
        - follow the skill boundary and output contract
        - preserve uncertainty
  - id: decision-rights-review-002
    case: near-miss
    input: |
      Give me a generic explanation unrelated to this skill.
    expected:
      should_trigger: false
      must_not:
        - perform the full decision-rights-review workflow
  - id: decision-rights-review-003
    case: evidence-boundary
    input: |
      The organisation has conflicting stakeholder accounts and missing ownership data. Use decision-rights-review without inventing facts.
    expected:
      should_trigger: true
      must:
        - distinguish evidence from inference
        - surface material unknowns
  - id: decision-rights-review-004
    case: identified-decision-ownership
    input: |
      For launch-date decisions the formal owner is Product, but Sales and IT appear to have
      de facto approval rights. Map who proposes, decides, advises, executes and escalates.
    expected:
      should_trigger: true
      must:
        - focus on formal versus actual ownership and authority for the identified decision
        - distinguish consultation from de facto decision authority
  - id: decision-rights-review-005
    case: mixed-interface-near-miss
    input: |
      Product, Sales and IT have unclear handoffs, accountability gaps and uncertain capacity authority.
      We need to understand the organisational failure before deciding whether decision rights are the cause.
    expected:
      should_trigger: false
      must_not:
        - lead with decision-rights review before the mixed operating-model problem is scoped

