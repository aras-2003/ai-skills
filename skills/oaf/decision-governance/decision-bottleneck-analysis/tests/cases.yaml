cases:
  - id: decision-bottleneck-analysis-001
    case: positive
    input: |
      Apply decision-bottleneck-analysis to an enterprise IT organisational architecture problem with incomplete but usable evidence.
    expected:
      should_trigger: true
      must:
        - distinguish evidence from inference
        - follow the skill output contract
  - id: decision-bottleneck-analysis-002
    case: boundary
    input: |
      Give me a generic management best-practice answer without the specific problem this skill addresses.
    expected:
      should_trigger: false
      must_not:
        - run the full decision-bottleneck-analysis procedure
  - id: decision-bottleneck-analysis-003
    case: missing-evidence
    input: |
      Use decision-bottleneck-analysis, but several owners, thresholds or decision facts are unknown.
    expected:
      should_trigger: true
      must:
        - preserve unknowns
        - avoid inventing missing organisational facts
  - id: decision-bottleneck-analysis-004
    case: identified-decision-class
    input: |
      Customer commitment exceptions are repeatedly escalated and wait several days.
      Trace the formal and actual path for this specific decision class, including waits,
      vetoes, missing evidence and rework.
    expected:
      should_trigger: true
      must:
        - trace the identified decision class rather than broaden to the whole operating model
        - distinguish wait time, vetoes, evidence gaps and authority ambiguity
  - id: decision-bottleneck-analysis-005
    case: mixed-interface-near-miss
    input: |
      Product, Sales and IT have unclear handoffs, accountability gaps and uncertain capacity authority.
      We do not yet know whether the main failure is structure, ownership or decision latency.
    expected:
      should_trigger: false
      must_not:
        - lead with decision-bottleneck analysis before a problematic decision class is identified

