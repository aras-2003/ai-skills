name: Package production plugin

on:
  push:
    branches: [production]
    paths:
      - "skills/**"
      - "workflows/**"
      - "scripts/package/**"
      - ".agents/plugins/marketplace.json"

permissions:
  contents: write

concurrency:
  group: production-packaging
  cancel-in-progress: false

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        run: python -m pip install "PyYAML>=6.0,<7"

      - name: Build plugin from production-maturity skills
        run: python scripts/package/build_plugin.py --maturity production --output plugins/arek-ai-skills

      - name: Commit generated plugin package
        run: |
          if [ -z "$(git status --porcelain -- plugins/arek-ai-skills)" ]; then
            echo "Plugin package already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/arek-ai-skills
          git commit -m "build: refresh production ChatGPT plugin [skip ci]"
          git pull --rebase origin production
          git push origin HEAD:production
