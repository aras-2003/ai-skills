name: Contract integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static validation
        run: python scripts/validate/validate_all.py
      - name: Validator mutation tests
        run: python -m unittest discover -s scripts/validate/tests -p "test_*.py"
      - name: Eval protocol tests
        run: python -m unittest discover -s scripts/eval/tests -p "test_*.py"
      - name: Build production plugin to temporary output
        run: python scripts/package/build_plugin.py --maturity production --output .tmp/production-plugin
      - name: Build candidate lab to temporary output
        run: python scripts/package/build_lab_plugin.py --output .tmp/lab-plugin
      - name: Build ChatGPT ZIPs to temporary output
        run: python scripts/package/build_chatgpt_skills.py --maturity production --output .tmp/chatgpt-skills
      - name: Verify lab eval isolation
        run: python scripts/eval/validate_isolation.py --artifact .tmp/lab-plugin
