name: Eval integrity

on:
  pull_request:
    branches: [main, production]
    paths:
      - "evals/**"
      - "scripts/eval/**"
      - "scripts/package/build_lab_plugin.py"
      - ".github/workflows/eval-integrity.yml"

permissions:
  contents: read

jobs:
  eval-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate input/rubric isolation
        run: python scripts/eval/validate_isolation.py
      - name: Run eval protocol unit tests
        run: python -m unittest discover -s scripts/eval/tests -p "test_*.py"
      - name: Build lab artifact in temporary path
        run: python scripts/package/build_lab_plugin.py --output .tmp/arek-ai-skills-lab
      - name: Verify built artifact contains no rubrics
        run: python scripts/eval/validate_isolation.py --artifact .tmp/arek-ai-skills-lab
