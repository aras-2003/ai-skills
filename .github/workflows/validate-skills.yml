name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static validation
        run: python scripts/validate/validate_all.py
      - name: Validator mutation tests
        run: python -m unittest discover -s scripts/validate/tests -p 'test_*.py'
      - name: Eval integrity tests
        run: |
          python scripts/eval/validate_isolation.py
          python -m unittest discover -s scripts/eval/tests -p 'test_*.py'
      - name: Packaging tests
        run: python -m unittest discover -s scripts/package/tests -p 'test_*.py'
      - name: Verify generated catalog is current
        run: |
          python scripts/catalog/generate_catalog.py
          git diff --exit-code -- CATALOG.md
      - name: Build production plugin
        run: python scripts/package/build_plugin.py --maturity production --output .tmp/arek-ai-skills
      - name: Build isolated lab plugin
        run: python scripts/package/build_lab_plugin.py --output .tmp/arek-ai-skills-lab
      - name: Verify lab rubric isolation
        run: python scripts/eval/validate_isolation.py --artifact .tmp/arek-ai-skills-lab
      - name: Build ChatGPT skill bundles
        run: python scripts/package/build_chatgpt_skills.py --maturity production --output .tmp/chatgpt-skills
      - name: Verify build manifests exist
        run: |
          test -f .tmp/arek-ai-skills/capabilities.json
          test -f .tmp/arek-ai-skills/release-manifest.json
          test -f .tmp/arek-ai-skills-lab/capabilities.json
          test -f .tmp/arek-ai-skills-lab/release-manifest.json
          test -f .tmp/chatgpt-skills/capabilities.json
          test -f .tmp/chatgpt-skills/release-manifest.json
