name: Validate skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/validate/**"
      - "scripts/catalog/**"
      - "scripts/eval/**"
      - "evals/**"
      - "scripts/package/build_lab_plugin.py"
      - "requirements-dev.txt"
      - ".github/workflows/validate-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/validate/**"
      - "scripts/catalog/**"
      - "scripts/eval/**"
      - "evals/**"
      - "scripts/package/build_lab_plugin.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static validation
        run: python scripts/validate/validate_all.py
      - name: Eval protocol tests
        run: python -m unittest discover -s scripts/eval/tests -p 'test_*.py'
      - name: Build isolated lab fixture package
        run: python scripts/package/build_lab_plugin.py --output /tmp/arek-ai-skills-lab
      - name: Verify eval rubric isolation
        run: python scripts/eval/validate_isolation.py --artifact /tmp/arek-ai-skills-lab
      - name: Verify generated catalog is current
        run: |
          python scripts/catalog/generate_catalog.py
          git diff --exit-code -- CATALOG.md
