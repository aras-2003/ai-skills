name: Package ChatGPT personal skills

on:
  push:
    branches: [production]
    paths:
      - "skills/**"
      - "scripts/package/build_chatgpt_skills.py"
      - ".github/workflows/package-chatgpt-skills.yml"

permissions:
  contents: write

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        run: python -m pip install "PyYAML>=6.0,<7"

      - name: Build personal ChatGPT skill bundles
        run: python scripts/package/build_chatgpt_skills.py --maturity production --output dist/chatgpt-skills

      - name: Commit generated ChatGPT skill bundles
        run: |
          if [ -z "$(git status --porcelain -- dist/chatgpt-skills)" ]; then
            echo "ChatGPT skill bundles already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/chatgpt-skills
          git commit -m "build: refresh ChatGPT personal skills [skip ci]"
          git push

      - name: Upload bundles as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-personal-skills
          path: dist/chatgpt-skills/*.zip
          if-no-files-found: error
