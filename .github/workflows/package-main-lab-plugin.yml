name: Package candidate skill lab

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-lab-packaging
  cancel-in-progress: false

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate exact Lab source
        run: |
          python scripts/validate/validate_all.py
          python scripts/eval/validate_isolation.py
          python -m unittest discover -s scripts/eval/tests -p "test_*.py"
      - name: Build and validate isolated Lab
        run: |
          python scripts/package/build_lab_plugin.py --output plugins/arek-ai-skills-lab
          python scripts/package/artifact_validation.py plugins/arek-ai-skills-lab
          python scripts/eval/validate_isolation.py --artifact plugins/arek-ai-skills-lab
      - name: Refuse stale Lab publication
        run: |
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$REMOTE_SHA" = "$SOURCE_REVISION" || {
            echo "main moved from $SOURCE_REVISION to $REMOTE_SHA; refusing stale Lab publication"
            exit 1
          }
      - name: Commit generated Lab
        run: |
          if [ -z "$(git status --porcelain -- plugins/arek-ai-skills-lab)" ]; then
            echo "Lab already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/arek-ai-skills-lab
          git commit -m "build: refresh isolated Lab from $SOURCE_REVISION [skip ci]"
          git push origin HEAD:main
