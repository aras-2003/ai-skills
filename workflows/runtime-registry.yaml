      version: "1.0.0"
      maturity: production
      risk: medium
      last_reviewed: 2026-09-30
      execution:
        default_model_class: standard
        validated_models:
          luna:
            status: pass
            validated_on: 2026-09-30
            validated_use:
              - cross-domain diagnosis
              - workflow synthesis
