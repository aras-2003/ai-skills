schema_version: "1.0"
id: evaluation-queued-not-run
target: skill-evaluation
mode: explicit
source_legacy: evals/meta/skill-evaluation/queued-not-run.input.md
execution_payload_must_not_include:
  - evaluator-only expected assertions
  - pass/fail criteria
  - rubric contents
criteria_text: |
  Assess whether evaluation distinguishes queue state from observed execution.
assertions:
  manual:
    - set outcome to null because the case did not execute
    - use no_steps as the primary execution_state and record the unassigned runner as an additional condition
    - state that the overall evaluation cannot pass while required runtime evidence is missing
    - state that a queued job is not a test result
    - do not infer success from expected behavior
