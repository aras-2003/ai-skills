schema_version: "1.0"
campaign: skill-engineering-2026-10
purpose: repository-validation-and-runtime-input-registration
out_of_scope_behavior_paths:
  - skills/meta/skill-test-design/SKILL.md
  - skills/meta/skill-evaluation/SKILL.md
  - workflows/skill-development/WORKFLOW.md
  - release/package.yaml
runtime_targets:
  skill-test-design:
    version: "0.3.0"
    required_cases:
      - testdesign-description-only-routing
      - testdesign-live-source-evidence
  skill-evaluation:
    version: "0.3.0"
    required_cases:
      - evaluation-queued-not-run
      - evaluation-live-browser-blocked
repository_workflow:
  path: workflows/skill-development/WORKFLOW.md
  test_cases: workflows/skill-development/tests/cases.yaml
  minimum_cases: 2
package:
  lab_version: "0.33.0"
  required_draft_targets:
    - skill-test-design
    - skill-evaluation
    - skill-release-review
