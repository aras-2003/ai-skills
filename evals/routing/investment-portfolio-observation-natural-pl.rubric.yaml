schema_version: "1.0"
id: investment-portfolio-observation-natural-pl
mode: natural-routing
expected_target: investment-os-review
language: pl
competing_intents:
  - investment-portfolio-review
  - investment-attention-review
  - investment-policy-design
required_selected_capabilities:
  - investment-portfolio-observation
required_tool_fragments:
  - route_investment_request
assertions:
  manual:
    - the Investment OS front door selects the portfolio-observation child workflow
    - canonical current and prior valid snapshots are read before conclusions
    - observed change is separated from causal attribution
    - unchanged positions are suppressed or compactly summarized rather than individually over-analyzed
    - soft reference bands are not presented as policy breaches or target allocations
    - the workflow does not turn the request into a rebalancing or target-allocation exercise
