schema_version: "1.0"
id: investment-portfolio-natural-en
mode: natural-routing
expected_target: investment-os-review
language: en
competing_intents:
  - portfolio-state-review
  - position-sizing-review
  - investment-security-review
required_selected_capabilities:
  - investment-portfolio-review
required_tool_fragments:
  - route_investment_request
assertions:
  manual:
    - the Investment OS front door is selected and invokes the full portfolio-review child workflow rather than generic investment commentary
    - canonical portfolio reads are attempted even though the prompt already supplies weights
    - user-supplied holdings remain evidence to reconcile rather than silently replacing canonical state
    - substantial chartable portfolio data reach integrated reporting and the required visual-floor path
    - the workflow does not stop after a prose-only concentration analysis
