schema_version: "1.0"
id: "case-004-theme-discovery"
target: "investment-theme-discovery"
mode: explicit
execution_payload_must_not_include: [expected routing, pass/fail criteria, expected answer]
criteria_text: |-
  PASS maps value-chain economics and bottlenecks, separates secular/cyclical/narrative effects, requires economic capture for beneficiaries and narrows to XTB research candidates.
assertions:
  manual:
    - "map the economic value chain and bottlenecks"
    - "separate secular demand, cyclical capacity and narrative effects"
    - "require evidence of economic capture for second-order beneficiaries"
    - "identify invalidation conditions and crowded assumptions"
    - "intersect research queue with XTB availability"
  manual_not:
    - "treat theme popularity as investment evidence"
