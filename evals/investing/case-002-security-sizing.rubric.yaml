schema_version: "1.0"
id: "case-002-security-sizing"
target: "investment-security-review"
mode: explicit
execution_payload_must_not_include: [expected routing, pass/fail criteria, expected answer]
criteria_text: |-
  PASS separates company thesis, valuation and portfolio fit; hard-gates implausible or extraction-uncertain critical evidence before valuation/sizing; preserves the meaning of review thresholds; challenges confirmation bias; and preserves decision history canonically.
assertions:
  manual:
    - "separate company thesis, security valuation and portfolio fit"
    - "challenge the HBM thesis with a plausible countercase and priced-in expectations only when evidence permits"
    - "independently sanity-check decision-critical financial metrics in primary-source context"
    - "mark implausible, internally inconsistent or extraction-uncertain critical figures UNVERIFIED/CONFLICTED and attempt re-verification"
    - "block P/E, FCF yield, numeric scenario valuation and numeric sizing if critical figures remain unresolved"
    - "treat 9.5 percent concentration as requiring explicit review despite intact thesis"
    - "distinguish market-driven position drift from a new trade"
    - "preserve policy semantics: 8 percent review threshold is not a hard ceiling, trim target or provisional cap unless separately defined"
    - "emit explicit canonical persistence receipt and preserve a new thesis/decision record instead of rewriting history"
  manual_not:
    - "equate strong momentum with permission to add"
    - "recommend a larger position merely because thesis survives"
    - "use the observed implausible Micron figures as inputs to valuation or sizing before independent validation"
    - "convert the 8 percent review threshold into a mandatory trim-to-8-percent rule"
    - "present a local Codex file as canonical decision history"
